worker_processes auto;
events { worker_connections 1024; }

http {
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 120m;

  # Don't advertise the nginx version in Server: or default error pages.
  server_tokens off;

  # TLS session cache (shared across workers; 10MB ≈ 40k sessions).
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1h;
  ssl_session_tickets off;

  # Rate-limit zone for the public share endpoint: 30 req/s per client
  # IP with a small burst. Tune per deployment; the default is sized
  # for a few thousand concurrent recipients sharing a link.
  limit_req_zone $binary_remote_addr zone=share_req:10m rate=30r/s;
  limit_req_status 429;

  upstream api_backend { server api:8082; }
  upstream share_backend { server share-gateway:8084; }
  upstream frontend_backend { server frontend:80; }

  # HTTP → HTTPS redirect. The :HTTPS_PORT suffix is templated in at
  # container start (see the edge entrypoint in docker-compose.yml) so
  # the redirect target matches the host port the edge is actually
  # published on (default 8443 in compose, 443 in production).
  # $host strips the port from Host: so we have to add the HTTPS port
  # ourselves — otherwise Firefox/Chrome follow to https://localhost/
  # and get a connection-refused.
  map $host $edge_host_only {
    "~^(?<h>[^:]+)(:.*)?$" $h;
    default $host;
  }
  server {
    listen 80;
    location /healthz { return 200 'ok'; add_header Content-Type text/plain; }
    location / { return 301 https://$edge_host_only:__EDGE_HTTPS_PORT__$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    # TLS 1.3 only. 1.2 kept off so weaker cipher negotiation can't
    # happen; downgrade to "TLSv1.2 TLSv1.3" if an older client base
    # must be supported.
    ssl_protocols       TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Conservative CSP: SPA assets self-host, no inline scripts, no
    # remote CDNs. Tighten in prod (add script-src hashes for inline
    # style tags the Vite build may emit).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    # Authenticated JSON API + vault ops.
    location /api/ {
      proxy_pass http://api_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 60s;
    }

    # Public share downloads — served by the isolated share-gateway.
    # proxy_buffering is off so large downloads stream without
    # materializing on the edge disk. Rate-limit per client IP to
    # blunt brute-force token scraping; 20-burst handles a quick
    # retry without rejecting real users.
    location /s/ {
      limit_req zone=share_req burst=20 nodelay;
      proxy_pass http://share_backend;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # SPA + static assets.
    location / {
      proxy_pass http://frontend_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
