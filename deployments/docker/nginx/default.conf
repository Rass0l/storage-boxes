server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 110m;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API traffic through to the api container so the browser sees a
  # single origin and session cookies stay first-party.
  location /api/ {
    proxy_pass http://api:8082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
  }

  # Pass health probes through so the browser-side HealthBadge reflects the
  # API (not just nginx itself).
  location = /healthz { proxy_pass http://api:8082/healthz; }
  location = /readyz  { proxy_pass http://api:8082/readyz;  }

  # Dedicated edge-only probe for nginx container healthcheck.
  location = /_edge_healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }
}
