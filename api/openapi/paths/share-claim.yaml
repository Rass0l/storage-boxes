delete:
  summary: Revoke a single recipient claim.
  description: |
    Stamps `revoked_at` on the claim row. The recipient's cookie
    stops working on the next restricted-delivery attempt; the
    gateway records that attempt as a
    `share_access_events` row with `reason=claim_revoked` attributed
    to the recipient, and emits a `shares.access_denied` audit
    event. Creator ownership of the parent share is enforced before
    the revocation is applied.
  parameters:
    - in: path
      name: id
      required: true
      schema: { type: string }
    - in: path
      name: cid
      required: true
      schema: { type: string }
  responses:
    '204': { description: Revoked. }
    '404': { description: Share not found or not owned by caller. }
    '503': { description: Restricted sharing not configured. }
