get:
  summary: List claims (recipient cookie sessions) for a restricted share.
  description: |
    Returns every `share_claims` row for the share, newest first,
    including revoked and OTP-pending entries. The raw cookie value
    is never returned; only the server-side `token_hash` would be
    retained and that too is omitted from the response.

    Use this together with
    `/api/v1/shares/{id}/recipients/{rid}/activity` to see which
    recipient cookies are currently live.
  parameters:
    - in: path
      name: id
      required: true
      schema: { type: string }
  responses:
    '200': { description: Claim list. }
    '404': { description: Share not found or not owned by caller. }
    '503': { description: Restricted sharing not configured. }
